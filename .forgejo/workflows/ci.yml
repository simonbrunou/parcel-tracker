# Runs on the self-hosted Forgejo (git.sbrn.eu), the source of truth; the GitHub
# repository is a push mirror and runs no CI. Image publishing stays on GitHub:
# .github/workflows/docker-publish.yml pushes to ghcr.io when main or a v* tag
# reaches the mirror.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: cd web && npm ci && npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint
        run: go vet ./...

      - name: Build
        run: go build ./cmd/parcel-tracker

      - name: Run tests
        run: go test ./internal/... -count=1 -timeout 120s -coverprofile=coverage.out

      - name: Coverage summary
        run: go tool cover -func=coverage.out
